<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>初萊食麵｜外送平台</title>
<link
    rel="stylesheet"
    href="css/style.css">
<style>
/* =========================================
   初萊食麵｜外送平台頁面
========================================= */
.delivery-page {
    min-height: 100vh;
    padding: 30px 20px 50px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
}
/* 標題 */
.delivery-header {
    text-align: center;
    margin-bottom: 30px;
}
.delivery-header h1 {
    margin: 0 0 10px;
}
.delivery-header p {
    margin: 0;
    opacity: 0.8;
}
/* 外送平台區 */
.delivery-platforms {
    width: 100%;
    max-width: 500px;
    display: flex;
    flex-direction: column;
    gap: 18px;
}
/* 平台按鈕 */
.delivery-platform {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 70px;
    padding: 15px 20px;
    box-sizing: border-box;
    border-radius: 16px;
    text-decoration: none;
    font-size: 21px;
    font-weight: bold;
    transition: transform 0.2s ease,
                box-shadow 0.2s ease;
}
/* 點擊效果 */
.delivery-platform:active {
    transform: scale(0.97);
}
/* Uber Eats */
.delivery-platform.uber {
    background: #000;
    color: #fff;
}
/* foodpanda */
.delivery-platform.panda {
    background: #d50070;
    color: #fff;
}
/* foodomo */
.delivery-platform.foodmo {
    background: #f5b400;
    color: #222;
}
/* 返回首頁 */
.back-home {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-top: 30px;
    min-height: 55px;
    padding: 0 30px;
    border-radius: 14px;
    background: #d4af37;
    color: #222;
    text-decoration: none;
    font-size: 18px;
    font-weight: bold;
    box-sizing: border-box;
}
/* 手機版 */
@media (max-width: 480px) {
    .delivery-page {
        padding: 25px 16px 40px;
    }
    .delivery-header h1 {
        font-size: 28px;
    }
    .delivery-platform {
        min-height: 68px;
        font-size: 20px;
    }
}
</style>
</head>
<body>
<main class="delivery-page">
<!-- =========================
     標題
========================= -->
<header class="delivery-header">
    <h1>
        🛵 初萊食麵外送平台
    </h1>
    <p>
        選擇您習慣的外送平台點餐
    </p>
</header>
<!-- =========================
     外送平台
========================= -->
<section class="delivery-platforms">
    <!-- Uber Eats -->
    <a
        class="delivery-platform uber"
        href="https://www.ubereats.com/tw/store/%E5%88%9D%E8%90%8A%E9%A3%9F%E9%BA%B5%7C%E5%A4%A7%E8%85%B8%E9%A6%99%E8%85%B8%E3%80%81%E9%97%9C%E6%9D%B1%E7%85%AE/9-pIirZHWkWxCprbnjgzBQ?diningMode=PICKUP&ps=1&sc=SEARCH_SUGGESTION"
        target="_blank"
        rel="noopener">
        🛵 Uber Eats
    </a>
    <!-- foodpanda -->
    <a
        class="delivery-platform panda"
        href="https://foodpanda.com.tw/restaurant/o32y/chu-lai-shi-mian"
        target="_blank"
        rel="noopener">
        🛵 foodpanda
    </a>
    <!-- foodomo -->
    <a
        class="delivery-platform foodmo"
        href="https://www.foodomo.com/store?stid=163737&number=0903392687"
        target="_blank"
        rel="noopener">
        🛵 foodomo
    </a>
</section>
<!-- =========================
     返回首頁
========================= -->
<a
    href="index.html"
    class="back-home">
    ← 返回初萊食麵首頁
</a>
</main>
</body>
</html>
