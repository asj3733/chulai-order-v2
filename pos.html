<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<meta
    name="theme-color"
    content="#111111">

<title>
    初萊食麵｜POS 3.0
</title>

<link
    rel="stylesheet"
    href="css/pos.css">

</head>


<body>


<!-- ==================================================
頂部
================================================== -->

<header class="pos-header">

    <div class="brand-area">

        <div class="brand-icon">
            🍜
        </div>

        <div>

            <h1>
                初萊食麵
            </h1>

            <p>
                POS 後台 3.0
            </p>

        </div>

    </div>


    <button
        id="refresh-btn"
        class="refresh-btn"
        type="button">

        🔄 更新

    </button>

</header>



<!-- ==================================================
系統連線狀態
================================================== -->

<div
    id="system-status"
    class="system-status">

    🔄 正在連線 POS 系統...

</div>



<!-- ==================================================
今日營業統計
================================================== -->

<section class="stats-grid">


    <div class="stat-card">

        <div class="stat-icon">
            📋
        </div>

        <div class="stat-info">

            <span>
                今日訂單
            </span>

            <strong id="today-order-count">
                0
            </strong>

            <small>
                筆
            </small>

        </div>

    </div>



    <div class="stat-card">

        <div class="stat-icon">
            💰
        </div>

        <div class="stat-info">

            <span>
                今日營業額
            </span>

            <strong id="today-total">
                NT$0
            </strong>

        </div>

    </div>



    <div class="stat-card">

        <div class="stat-icon">
            🔴
        </div>

        <div class="stat-info">

            <span>
                待處理
            </span>

            <strong id="pending-count">
                0
            </strong>

            <small>
                筆
            </small>

        </div>

    </div>


</section>



<!-- ==================================================
訂單狀態篩選
================================================== -->

<section class="filter-section">


    <button
        class="filter-btn active"
        data-filter="全部"
        type="button">

        全部

    </button>


    <button
        class="filter-btn"
        data-filter="新訂單"
        type="button">

        🔴 新訂單

    </button>


    <button
        class="filter-btn"
        data-filter="已接單"
        type="button">

        🟡 已接單

    </button>


    <button
        class="filter-btn"
        data-filter="製作中"
        type="button">

        🟠 製作中

    </button>


    <button
        class="filter-btn"
        data-filter="可取餐"
        type="button">

        🟢 可取餐

    </button>


    <button
        class="filter-btn"
        data-filter="已完成"
        type="button">

        ✅ 已完成

    </button>


    <button
        class="filter-btn"
        data-filter="取消"
        type="button">

        ❌ 取消

    </button>


</section>



<!-- ==================================================
訂單區
================================================== -->

<main class="main-content">


    <div class="section-title">

        <div>

            <h2>
                📋 訂單管理
            </h2>

            <p>
                即時查看與處理店內訂單
            </p>

        </div>


        <div class="live-indicator">

            <span></span>

            即時同步

        </div>

    </div>



    <!-- 訂單列表 -->

    <div
        id="orders-container"
        class="orders-container">


        <div class="loading-card">

            <div class="loading-icon">
                🔄
            </div>

            <p>
                正在載入訂單...
            </p>

            <small>
                請稍候
            </small>

        </div>


    </div>


</main>



<!-- ==================================================
訂單詳細 Modal
================================================== -->

<div
    id="order-modal"
    class="modal">


    <div class="modal-box">


        <!-- Modal 頂部 -->

        <div class="modal-header">


            <div>

                <h2>
                    📋 訂單詳細
                </h2>

                <p>
                    查看完整訂單資訊
                </p>

            </div>


            <button
                id="close-modal"
                class="close-modal"
                type="button">

                ✕

            </button>


        </div>



        <!-- 訂單詳細內容 -->

        <div
            id="order-detail"
            class="order-detail">

        </div>


    </div>


</div>



<!-- ==================================================
JavaScript
================================================== -->

<script
    src="js/pos.js">

</script>


</body>

</html>
