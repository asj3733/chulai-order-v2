<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>初萊食麵｜確認訂單</title>

<link
    rel="stylesheet"
    href="css/style.css">

<link
    rel="stylesheet"
    href="css/checkout.css">

</head>


<body>


<!-- =========================
     頁首
========================= -->

<header class="page-header">

    <a
        href="index.html"
        class="brand-home">

        🍜 初萊食麵

    </a>

    <p>
        確認訂單
    </p>

</header>



<main class="checkout-page">


<!-- =========================
     歡迎回來
========================= -->

<section
    id="welcome-customer"
    class="welcome-customer"
    style="display:none;">

    👋 歡迎回來，

    <strong id="welcome-name"></strong>

</section>



<!-- =========================
     訂單內容
========================= -->

<section class="checkout-section">

    <h2>
        🛒 您的訂單
    </h2>


    <div id="order-list">

        尚未加入商品

    </div>

</section>



<!-- =========================
     顧客資料
========================= -->

<section class="checkout-section">

    <h2>
        👤 顧客資料
    </h2>


    <label>

        姓名

        <input
            type="text"
            id="customer-name"
            placeholder="請輸入姓名"
            autocomplete="name">

    </label>


    <label>

        手機號碼

        <input
            type="tel"
            id="customer-phone"
            placeholder="09xxxxxxxx"
            maxlength="10"
            inputmode="numeric"
            autocomplete="tel">

    </label>


    <div
        id="phone-error"
        class="form-error"
        style="display:none;">

        請輸入正確的手機號碼

    </div>

</section>



<!-- =========================
     取餐方式
========================= -->

<section class="checkout-section">

    <h2>
        🍜 取餐方式
    </h2>


    <div class="order-type-options">


        <label class="choice-card">

            <input
                type="radio"
                name="order-type"
                value="內用"
                checked>

            <span class="choice-card-icon">
                🍜
            </span>

            <span class="choice-card-text">

                <strong>
                    內用
                </strong>

                <small>
                    到店內用餐
                </small>

            </span>

        </label>



        <label class="choice-card">

            <input
                type="radio"
                name="order-type"
                value="外帶">

            <span class="choice-card-icon">
                🥡
            </span>

            <span class="choice-card-text">

                <strong>
                    外帶
                </strong>

                <small>
                    到店取餐
                </small>

            </span>

        </label>


    </div>

</section>



<!-- =========================
     外帶設定
========================= -->

<section
    id="takeout-options"
    class="checkout-section takeout-section"
    style="display:none;">

    <h2>
        🥡 外帶設定
    </h2>


    <!-- =========================
         取餐方式
    ========================= -->

    <h3>
        ⏰ 取餐時間
    </h3>


    <div class="pickup-type-options">


        <label class="pickup-card">

            <input
                type="radio"
                name="pickup-mode"
                value="最快取餐"
                checked>

            <span>

                🏃

            </span>

            <strong>

                最快取餐

            </strong>

            <small>

                店家會盡快準備

            </small>

        </label>



        <label class="pickup-card">

            <input
                type="radio"
                name="pickup-mode"
                value="預約取餐">

            <span>

                ⏰

            </span>

            <strong>

                預約取餐

            </strong>

            <small>

                自行選擇取餐時間

            </small>

        </label>


    </div>



    <!-- =========================
         預約時間
    ========================= -->

    <div
        id="reservation-time-area"
        class="reservation-time-area"
        style="display:none;">


        <label>

            📅 取餐日期

            <select id="pickup-date">

                <option value="">
                    請選擇日期
                </option>

            </select>

        </label>



        <label>

            ⏰ 取餐時間

            <select id="pickup-time">

                <option value="">
                    請選擇時間
                </option>

            </select>

        </label>


    </div>



    <!-- =========================
         餐具
    ========================= -->

    <h3>
        🍴 餐具
    </h3>


    <div class="tableware-options">


        <label class="choice-card small-card">

            <input
                type="radio"
                name="tableware"
                value="需要餐具"
                checked>

            <span>

                🍴

            </span>

            <strong>

                需要餐具

            </strong>

        </label>



        <label class="choice-card small-card">

            <input
                type="radio"
                name="tableware"
                value="不需要餐具">

            <span>

                ♻️

            </span>

            <strong>

                不需要餐具

            </strong>

        </label>


    </div>


</section>



<!-- =========================
     備註
========================= -->

<section class="checkout-section">

    <h2>
        📝 備註
    </h2>


    <textarea
        id="customer-note"
        rows="4"
        placeholder="有其他需要告知店家的事項，可以填寫在這裡"></textarea>

</section>



<!-- =========================
     總金額
========================= -->

<section class="checkout-total">

    <strong>
        訂單合計
    </strong>

    <span>
        NT$<b id="order-total">0</b>
    </span>

</section>



<!-- =========================
     送出訂單
========================= -->

<button
    type="button"
    id="submit-order-btn"
    class="submit-order-btn">

    📲 送出訂單

</button>



<!-- =========================
     返回修改
========================= -->

<button
    type="button"
    id="back-order-btn"
    class="back-order-btn">

    ← 返回修改餐點

</button>



<!-- =========================
     送單結果
========================= -->

<div
    id="submit-result"
    class="submit-result"
    style="display:none;">

</div>


</main>



<!-- =================================================
     訂單送出成功彈窗
================================================= -->

<div
    id="success-modal"
    class="success-modal"
    style="display:none;">


    <div class="success-modal-overlay">
    </div>


    <div
        class="success-modal-box"
        role="dialog"
        aria-modal="true">


        <div class="success-icon">

            🎉

        </div>


        <h2>

            訂單已送出成功！

        </h2>


        <p>

            感謝您選擇初萊食麵 ❤️

        </p>


        <p class="success-message">

            店家已收到您的訂單

        </p>


        <!-- 訂單摘要 -->

        <div
            id="success-order-summary"
            class="success-order-summary">

        </div>


        <button
            type="button"
            id="success-confirm-btn"
            class="success-confirm-btn">

            知道了

        </button>


    </div>

</div>



<script src="js/checkout.js"></script>

</body>

</html>
