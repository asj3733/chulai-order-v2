<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<meta
name=“viewport”
content=“width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no”

<title>初萊食麵｜POS 後台</title>
<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
body {
  margin: 0;
  background: #f2f3f5;
  color: #222;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans TC",
    "Microsoft JhengHei",
    sans-serif;
}
.header {
  position: sticky;
  top: 0;
  z-index: 100;
  background:
    linear-gradient(
      135deg,
      #222,
      #3d3d3d
    );
  color: white;
  padding: 15px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow:
    0 2px 10px
    rgba(0,0,0,.18);
}
.brand {
  font-size: 20px;
  font-weight: 800;
}
.brand small {
  display: block;
  margin-top: 3px;
  font-size: 11px;
  font-weight: 400;
  opacity: .65;
}
.header-right {
  display: flex;
  gap: 8px;
}
.icon-btn {
  width: 42px;
  height: 42px;
  border: 0;
  border-radius: 12px;
  background:
    rgba(255,255,255,.12);
  color: white;
  font-size: 20px;
}
.container {
  width: 100%;
  max-width: 900px;
  margin: auto;
  padding: 16px;
  padding-bottom: 100px;
}
.status-card {
  background: white;
  border-radius: 18px;
  padding: 16px;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow:
    0 2px 10px
    rgba(0,0,0,.06);
}
.status-left {
  display: flex;
  align-items: center;
  gap: 10px;
}
.status-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #22c55e;
  box-shadow:
    0 0 0 5px
    rgba(34,197,94,.12);
}
.status-dot.closed {
  background: #ef4444;
  box-shadow:
    0 0 0 5px
    rgba(239,68,68,.12);
}
.status-text {
  font-weight: 700;
}
.status-sub {
  margin-top: 3px;
  color: #888;
  font-size: 12px;
}
.notice {
  margin-bottom: 16px;
  padding: 13px 15px;
  border-radius: 14px;
  background: #fff8df;
  border: 1px solid #f0d77a;
  color: #735c00;
  font-size: 14px;
}
.stats {
  display: grid;
  grid-template-columns:
    repeat(3,1fr);
  gap: 10px;
  margin-bottom: 18px;
}
.stat-card {
  background: white;
  border-radius: 16px;
  padding: 15px 10px;
  text-align: center;
  box-shadow:
    0 2px 10px
    rgba(0,0,0,.05);
}
.stat-title {
  color: #888;
  font-size: 12px;
  margin-bottom: 8px;
}
.stat-value {
  font-size: 22px;
  font-weight: 800;
}
.pending {
  color: #d97706;
}
.section-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 20px 2px 12px;
}
.section-title h2 {
  margin: 0;
  font-size: 20px;
}
.refresh-time {
  color: #999;
  font-size: 11px;
}
.order-card {
  background: white;
  border-radius: 18px;
  margin-bottom: 14px;
  overflow: hidden;
  box-shadow:
    0 3px 12px
    rgba(0,0,0,.07);
}
.order-top {
  padding: 15px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  border-bottom: 1px solid #eee;
}
.order-number {
  font-size: 17px;
  font-weight: 800;
}
.order-time {
  margin-top: 4px;
  color: #999;
  font-size: 12px;
}
.order-status {
  padding: 6px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
}
.status-new {
  background: #fff1f2;
  color: #e11d48;
}
.status-accepted {
  background: #eff6ff;
  color: #2563eb;
}
.status-making {
  background: #fff7ed;
  color: #ea580c;
}
.status-ready {
  background: #ecfdf5;
  color: #059669;
}
.status-completed {
  background: #f3f4f6;
  color: #6b7280;
}
.status-cancelled {
  background: #fef2f2;
  color: #b91c1c;
}
.order-info {
  padding: 14px 15px 5px;
}
.customer {
  margin-bottom: 5px;
  font-weight: 700;
}
.customer-detail {
  color: #666;
  font-size: 13px;
  line-height: 1.7;
}
.order-items {
  margin: 12px 15px;
  padding: 12px;
  border-radius: 12px;
  background: #f7f7f7;
  white-space: pre-wrap;
  font-size: 14px;
  line-height: 1.7;
}
.order-bottom {
  padding: 12px 15px 15px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.total {
  font-size: 20px;
  font-weight: 800;
}
.total span {
  margin-right: 4px;
  color: #888;
  font-size: 12px;
}
.order-actions {
  padding: 0 15px 15px;
  display: grid;
  grid-template-columns:
    repeat(2,1fr);
  gap: 8px;
}
.action-btn {
  min-height: 46px;
  border: 0;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 700;
}
.btn-accept {
  background: #2563eb;
  color: white;
}
.btn-making {
  background: #f97316;
  color: white;
}
.btn-ready {
  background: #10b981;
  color: white;
}
.btn-complete {
  background: #374151;
  color: white;
}
.btn-cancel {
  background: #fee2e2;
  color: #b91c1c;
}
.action-btn:disabled {
  opacity: .4;
}
.empty {
  padding: 50px 20px;
  background: white;
  border-radius: 18px;
  text-align: center;
  color: #999;
}
.empty-icon {
  margin-bottom: 10px;
  font-size: 45px;
}
.error-box {
  margin-bottom: 15px;
  padding: 15px;
  border-radius: 14px;
  background: #fff1f2;
  border: 1px solid #fecdd3;
  color: #be123c;
  font-size: 14px;
  line-height: 1.7;
}
.error-button {
  margin-top: 12px;
  padding: 10px 16px;
  border: 0;
  border-radius: 10px;
  background: #be123c;
  color: white;
  font-weight: 700;
}
.loading {
  position: fixed;
  inset: 0;
  z-index: 999;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 12px;
  background:
    rgba(255,255,255,.9);
}
.spinner {
  width: 40px;
  height: 40px;
  border: 4px solid #ddd;
  border-top-color: #333;
  border-radius: 50%;
  animation:
    spin .8s linear infinite;
}
@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}
.hidden {
  display: none !important;
}
.toast {
  position: fixed;
  left: 50%;
  bottom: 25px;
  z-index: 1000;
  transform:
    translateX(-50%);
  padding: 12px 18px;
  border-radius: 999px;
  background: #222;
  color: white;
  font-size: 14px;
  opacity: 0;
  pointer-events: none;
  transition: .25s;
}
.toast.show {
  opacity: 1;
}
@media (min-width:700px) {
  .container {
    padding: 24px;
  }
  .order-actions {
    grid-template-columns:
      repeat(5,1fr);
  }
}
</style>
</head>
<body>
<header class="header">
  <div class="brand">
初萊食麵
<small>
  POS 後台管理系統
</small>
  </div>
  <div class="header-right">
<button
  class="icon-btn"
  onclick="loadAll()"
>
  🔄
</button>
<button
  class="icon-btn"
  onclick="showSettings()"
>
  ⚙️
</button>
  </div>
</header>
<main class="container">
  <div
    id="errorBox"
    class="error-box hidden"
  ></div>
  <div class="status-card">
<div class="status-left">
  <div
    id="statusDot"
    class="status-dot"
  ></div>
  <div>
    <div
      id="shopStatus"
      class="status-text"
    >
      連線中...
    </div>
    <div class="status-sub">
      初萊食麵目前營業狀態
    </div>
  </div>
</div>
  </div>
  <div
    id="notice"
    class="notice hidden"
  ></div>
  <div class="stats">
<div class="stat-card">
  <div class="stat-title">
    今日營業額
  </div>
  <div
    id="todayTotal"
    class="stat-value"
  >
    $0
  </div>
</div>
<div class="stat-card">
  <div class="stat-title">
    今日訂單
  </div>
  <div
    id="todayCount"
    class="stat-value"
  >
    0
  </div>
</div>
<div class="stat-card">
  <div class="stat-title">
    待處理
  </div>
  <div
    id="pendingCount"
    class="stat-value pending"
  >
    0
  </div>
</div>
  </div>
  <div class="section-title">
<h2>
  📋 訂單管理
</h2>
<div
  id="refreshTime"
  class="refresh-time"
>
  尚未更新
</div>
  </div>
  <div id="orders"></div>
</main>
<div
  id="loading"
  class="loading"
>
  <div class="spinner"></div>
  <div id="loadingText">
    正在連接 POS 後端...
  </div>
</div>
<div
  id="toast"
  class="toast"
></div>
<script>
/* ==================================================
   ① 最新 Apps Script URL
================================================== */
const API_URL =
  "https://script.google.com/macros/s/AKfycbwFD8XzZCmF7AKly_L0LDqA5JoERcg0eex2PzQFU4n_aBWqw9GJsRV-4XcMM_GLET8MLw/exec";
/* ==================================================
   ② 系統變數
================================================== */
let settings = {};
let orders = [];
let isLoading = false;
/* ==================================================
   ③ 頁面啟動
================================================== */
document.addEventListener(
  "DOMContentLoaded",
  function() {
    loadAll();
    setInterval(
      function() {
        if (!isLoading) {
          loadAll();
        }
      },
      10000
    );
  }
);
/* ==================================================
   ④ API 請求
   8 秒逾時
================================================== */
async function apiFetch(
  url
) {
  const controller =
    new AbortController();
  const timeout =
    setTimeout(
      function() {
        controller.abort();
      },
      8000
    );
  try {
    const response =
      await fetch(
        url,
        {
          method:
            "GET",
          cache:
            "no-store",
          signal:
            controller.signal
        }
      );
    clearTimeout(
      timeout
    );
    if (!response.ok) {
      throw new Error(
        "HTTP " +
        response.status
      );
    }
    const text =
      await response.text();
    if (!text) {
      throw new Error(
        "後端沒有回傳資料"
      );
    }
    let data;
    try {
      data =
        JSON.parse(
          text
        );
    } catch (error) {
      throw new Error(
        "後端回傳格式錯誤"
      );
    }
    return data;
  } catch (error) {
    clearTimeout(
      timeout
    );
    if (
      error.name ===
      "AbortError"
    ) {
      throw new Error(
        "連線逾時，請檢查 Apps Script 部署權限"
      );
    }
    throw error;
  }
}
/* ==================================================
   ⑤ 載入全部
================================================== */
async function loadAll() {
  if (isLoading) {
    return;
  }
  isLoading = true;
  showLoading(
    "正在連接 POS 後端..."
  );
  hideError();
  try {
    await loadSettings();
    await loadOrders();
    await loadStats();
    document
      .getElementById(
        "refreshTime"
      )
      .textContent =
      "更新：" +
      new Date()
        .toLocaleTimeString(
          "zh-TW"
        );
  } catch (error) {
    console.error(
      error
    );
    showError(
      "❌ POS 後端連線失敗<br><br>" +
      error.message +
      "<br><br>" +
      "請確認：<br>" +
      "① Apps Script 已重新部署<br>" +
      "② 執行身分選擇「我」<br>" +
      "③ 存取權限選擇「所有人」<br>" +
      "④ Web App URL 使用最新版本",
      true
    );
  }
  hideLoading();
  isLoading = false;
}
/* ==================================================
   ⑥ 讀取設定
================================================== */
async function loadSettings() {
  const data =
    await apiFetch(
      API_URL +
      "?action=getSettings"
    );
  if (
    !data.success
  ) {
    throw new Error(
      "設定 API：" +
      (
        data.error ||
        "回傳失敗"
      )
    );
  }
  settings =
    data.settings ||
    {};
  renderSettings();
}
/* ==================================================
   ⑦ 顯示設定
================================================== */
function renderSettings() {
  const status =
    settings["營業狀態"] ||
    "營業中";
  const notice =
    settings["公告"] ||
    "";
  document
    .getElementById(
      "shopStatus"
    )
    .textContent =
    status;
  const dot =
    document
      .getElementById(
        "statusDot"
      );
  if (
    status.includes(
      "休息"
    )
    ||
    status.includes(
      "暫停"
    )
    ||
    status.includes(
      "關閉"
    )
  ) {
    dot.classList.add(
      "closed"
    );
  } else {
    dot.classList.remove(
      "closed"
    );
  }
  const noticeBox =
    document
      .getElementById(
        "notice"
      );
  if (notice) {
    noticeBox.textContent =
      "📢 " +
      notice;
    noticeBox
      .classList
      .remove(
        "hidden"
      );
  } else {
    noticeBox
      .classList
      .add(
        "hidden"
      );
  }
}
/* ==================================================
   ⑧ 讀取訂單
================================================== */
async function loadOrders() {
  const data =
    await apiFetch(
      API_URL +
      "?action=getOrders"
    );
  if (
    !data.success
  ) {
    throw new Error(
      "訂單 API：" +
      (
        data.error ||
        "回傳失敗"
      )
    );
  }
  orders =
    data.orders ||
    [];
  renderOrders();
}
/* ==================================================
   ⑨ 讀取統計
================================================== */
async function loadStats() {
  const data =
    await apiFetch(
      API_URL +
      "?action=getTodayStats"
    );
  if (
    !data.success
  ) {
    throw new Error(
      "統計 API：" +
      (
        data.error ||
        "回傳失敗"
      )
    );
  }
  document
    .getElementById(
      "todayTotal"
    )
    .textContent =
    "$" +
    Number(
      data.total ||
      0
    ).toLocaleString();
  document
    .getElementById(
      "todayCount"
    )
    .textContent =
    data.orderCount ||
    0;
  document
    .getElementById(
      "pendingCount"
    )
    .textContent =
    data.pendingCount ||
    0;
}
/* ==================================================
   ⑩ 顯示訂單
================================================== */
function renderOrders() {
  const box =
    document
      .getElementById(
        "orders"
      );
  if (!orders.length) {
    box.innerHTML = `
      <div class="empty">
        <div class="empty-icon">
          🍜
        </div>
        <div>
          目前沒有訂單
        </div>
        <div
          style="
            margin-top:6px;
            font-size:12px;
          "
        >
          新訂單會自動出現在這裡
        </div>
      </div>
    `;
    return;
  }
  box.innerHTML =
    orders
      .map(
        renderOrder
      )
      .join("");
}
/* ==================================================
   ⑪ 訂單卡片
================================================== */
function renderOrder(
  order
) {
  const status =
    order.status ||
    "新訂單";
  return `
  <div class="order-card">
    <div class="order-top">
      <div>
        <div class="order-number">
          #${escapeHtml(
            order.orderId
          )}
        </div>
        <div class="order-time">
          ${escapeHtml(
            order.createdAt ||
            ""
          )}
        </div>
      </div>
      <div
        class="
          order-status
          ${getStatusClass(
            status
          )}
        "
      >
        ${escapeHtml(
          status
        )}
      </div>
    </div>
    <div class="order-info">
      <div class="customer">
        👤 ${escapeHtml(
          order.name ||
          "未提供姓名"
        )}
      </div>
      <div class="customer-detail">
        📞 ${escapeHtml(
          order.phone ||
          "未提供電話"
        )}
        <br>
        🛍️ ${escapeHtml(
          order.pickupType ||
          "外帶"
        )}
        ${
          order.pickupTime
            ? "｜⏰ " +
              escapeHtml(
                order.pickupTime
              )
            : ""
        }
      </div>
    </div>
    <div class="order-items">
      ${escapeHtml(
        order.items ||
        "未提供餐點"
      )}
    </div>
    ${
      order.note
        ? `
        <div
          style="
            padding:
              0 15px 10px;
            color:
              #b45309;
            font-size:
              13px;
          "
        >
          📝 備註：
          ${escapeHtml(
            order.note
          )}
        </div>
        `
        : ""
    }
    <div class="order-bottom">
      <div class="total">
        <span>
          合計
        </span>
        $
        ${Number(
          order.total ||
          0
        ).toLocaleString()}
      </div>
    </div>
    <div class="order-actions">
      <button
        class="action-btn btn-accept"
        onclick="
          updateStatus(
            '${escapeJs(
              order.orderId
            )}',
            '已接單'
          )
        "
      >
        📥 接單
      </button>
      <button
        class="action-btn btn-making"
        onclick="
          updateStatus(
            '${escapeJs(
              order.orderId
            )}',
            '製作中'
          )
        "
      >
        👨‍🍳 製作中
      </button>
      <button
        class="action-btn btn-ready"
        onclick="
          updateStatus(
            '${escapeJs(
              order.orderId
            )}',
            '可取餐'
          )
        "
      >
        🟢 可取餐
      </button>
      <button
        class="action-btn btn-complete"
        onclick="
          updateStatus(
            '${escapeJs(
              order.orderId
            )}',
            '已完成'
          )
        "
      >
        ✔️ 完成
      </button>
      <button
        class="action-btn btn-cancel"
        onclick="
          updateStatus(
            '${escapeJs(
              order.orderId
            )}',
            '取消'
          )
        "
      >
        ❌ 取消
      </button>
    </div>
  </div>
  `;
}
/* ==================================================
   ⑫ 更新狀態
================================================== */
async function updateStatus(
  orderId,
  status
) {
  if (
    !confirm(
      "確定將訂單 " +
      orderId +
      " 設為「" +
      status +
      "」嗎？"
    )
  ) {
    return;
  }
  showLoading(
    "正在更新訂單..."
  );
  try {
    const response =
      await fetch(
        API_URL,
        {
          method:
            "POST",
          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },
          body:
            JSON.stringify({
              action:
                "updateOrderStatus",
              orderId:
                orderId,
              status:
                status
            })
        }
      );
    const data =
      await response.json();
    if (
      !data.success
    ) {
      throw new Error(
        data.error ||
        "更新失敗"
      );
    }
    showToast(
      "✅ 已更新為「" +
      status +
      "」"
    );
    await loadAll();
  } catch (error) {
    showError(
      "❌ 更新訂單失敗<br><br>" +
      error.message
    );
  }
  hideLoading();
}
/* ==================================================
   ⑬ 設定
================================================== */
function showSettings() {
  alert(
    "⚙️ 系統設定\n\n" +
    "LINE Token、LINE Secret、店家 LINE User ID\n" +
    "目前統一放在 Google Sheet「設定」。\n\n" +
    "下一階段會升級成手機 POS 設定中心。"
  );
}
/* ==================================================
   ⑭ 狀態 CSS
================================================== */
function getStatusClass(
  status
) {
  const map = {
    "新訂單":
      "status-new",
    "已接單":
      "status-accepted",
    "製作中":
      "status-making",
    "可取餐":
      "status-ready",
    "已完成":
      "status-completed",
    "取消":
      "status-cancelled"
  };
  return (
    map[status] ||
    "status-new"
  );
}
/* ==================================================
   ⑮ Loading
================================================== */
function showLoading(
  text
) {
  document
    .getElementById(
      "loadingText"
    )
    .textContent =
    text;
  document
    .getElementById(
      "loading"
    )
    .classList
    .remove(
      "hidden"
    );
}
function hideLoading() {
  document
    .getElementById(
      "loading"
    )
    .classList
    .add(
      "hidden"
    );
}
/* ==================================================
   ⑯ 錯誤
================================================== */
function showError(
  message,
  withButton = false
) {
  const box =
    document
      .getElementById(
        "errorBox"
      );
  box.innerHTML =
    message +
    (
      withButton
        ? `
          <br>
          <button
            class="error-button"
            onclick="loadAll()"
          >
            🔄 重新連線
          </button>
        `
        : ""
    );
  box.classList
    .remove(
      "hidden"
    );
}
function hideError() {
  document
    .getElementById(
      "errorBox"
    )
    .classList
    .add(
      "hidden"
    );
}
/* ==================================================
   ⑰ Toast
================================================== */
let toastTimer;
function showToast(
  message
) {
  const toast =
    document
      .getElementById(
        "toast"
      );
  toast.textContent =
    message;
  toast.classList
    .add(
      "show"
    );
  clearTimeout(
    toastTimer
  );
  toastTimer =
    setTimeout(
      function() {
        toast.classList
          .remove(
            "show"
          );
      },
      2500
    );
}
/* ==================================================
   ⑱ HTML 安全
================================================== */
function escapeHtml(
  value
) {
  return String(
    value ||
    ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}
function escapeJs(
  value
) {
  return String(
    value ||
    ""
  )
    .replace(
      /\\/g,
      "\\\\"
    )
    .replace(
      /'/g,
      "\\'"
    )
    .replace(
      /\n/g,
      "\\n"
    )
    .replace(
      /\r/g,
      "\\r"
    );
}
