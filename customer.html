<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>初萊食麵｜客戶查詢</title>


<!-- 主樣式 -->

<link
    rel="stylesheet"
    href="css/style.css">


<!-- 客戶查詢專用樣式 -->

<link
    rel="stylesheet"
    href="css/customer.css">

</head>


<body>


<!-- =========================================
     頁首
========================================= -->

<header class="page-header">

    <a
        href="index.html"
        class="brand-home">

        🍜 初萊食麵

    </a>


    <p>

        客戶查詢

    </p>

</header>



<!-- =========================================
     主要內容
========================================= -->

<main class="customer-page">


<!-- =========================================
     客戶查詢區
========================================= -->

<section class="customer-search-card">


    <!-- 圖示 -->

    <div class="customer-icon">

        👤

    </div>



    <!-- 標題 -->

    <h1>

        歡迎回到初萊食麵

    </h1>



    <!-- 說明 -->

    <p class="customer-description">

        輸入您曾經訂餐的手機號碼<br>

        查看您的用餐紀錄

    </p>



    <!-- 手機號碼 -->

    <label
        for="customer-phone">

        📱 手機號碼

    </label>



    <input
        type="tel"
        id="customer-phone"
        class="customer-phone-input"
        placeholder="請輸入 09xxxxxxxx"
        maxlength="10"
        inputmode="numeric"
        autocomplete="tel">



    <!-- 電話錯誤 -->

    <div
        id="phone-error"
        class="customer-error"
        style="display:none;">

    </div>



    <!-- 查詢按鈕 -->

    <button
        type="button"
        id="customer-search-btn"
        class="customer-search-btn">

        🔍 查詢我的紀錄

    </button>



    <!-- 直接點餐 -->

    <a
        href="order.html"
        class="customer-order-btn">

        🍜 直接開始點餐

    </a>


</section>



<!-- =========================================
     查詢成功結果
========================================= -->

<section
    id="customer-result"
    class="customer-result"
    style="display:none;">


    <!-- 歡迎 -->

    <div class="result-welcome">


        <div class="customer-result-icon">

            🎉

        </div>



        <div>

            <strong id="result-name">

                歡迎回來

            </strong>


            <p id="result-message">

                很高興再次見到您

            </p>

        </div>


    </div>



    <!-- =====================================
         客戶統計
    ====================================== -->

    <div class="customer-stat-grid">


        <!-- 訂單次數 -->

        <div class="customer-stat-card">


            <span>

                🍜

            </span>


            <strong id="order-count">

                0

            </strong>


            <small>

                累計訂單

            </small>


        </div>



        <!-- 最近訂單 -->

        <div class="customer-stat-card">


            <span>

                🕒

            </span>


            <strong id="last-order-time">

                -

            </strong>


            <small>

                最近訂單

            </small>


        </div>


    </div>



    <!-- =====================================
         最近訂單
    ====================================== -->

    <div class="customer-info-box">


        <h3>

            📋 最近一次訂單

        </h3>


        <div id="last-order-content">

            -

        </div>


    </div>



    <!-- =====================================
         常點餐點
    ====================================== -->

    <div class="customer-info-box">


        <h3>

            ⭐ 常點餐點

        </h3>


        <div id="favorite-items">

            -

        </div>


    </div>



    <!-- =====================================
         再次點餐
    ====================================== -->

    <a
        href="order.html"
        class="customer-start-order">

        🍜 立即開始點餐

    </a>


</section>



<!-- =========================================
     查無資料
========================================= -->

<section
    id="customer-not-found"
    class="customer-not-found"
    style="display:none;">


    <div class="not-found-icon">

        🔍

    </div>



    <h2>

        尚未找到您的訂單紀錄

    </h2>



    <p>

        這可能是您第一次使用線上點餐。

        <br>

        歡迎開始您的第一筆訂單！

    </p>



    <a
        href="order.html"
        class="customer-start-order">

        🍜 開始第一次點餐

    </a>


</section>


</main>


<!-- =========================================
     載入客戶查詢 JS
========================================= -->

<script src="js/customer.js?v=20260728"></script>


</body>

</html>
