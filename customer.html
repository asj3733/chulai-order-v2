<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>初萊食麵｜客戶查詢</title>

<link
    rel="stylesheet"
    href="css/style.css">

<link
    rel="stylesheet"
    href="css/customer.css">

</head>


<body>


<header class="page-header">

    <a
        href="index.html"
        class="brand-home">

        🍜 初萊食麵

    </a>

    <p>
        客戶查詢
    </p>

</header>



<main class="customer-page">


<section class="customer-search-card">

    <div class="customer-icon">
        👤
    </div>


    <h1>
        歡迎回到初萊食麵
    </h1>


    <p class="customer-description">

        輸入您曾經訂餐的手機號碼<br>
        查看您的用餐紀錄

    </p>


    <label
        for="customer-phone">

        📱 手機號碼

    </label>


    <input
        type="tel"
        id="customer-phone"
        class="customer-phone-input"
        placeholder="請輸入 09xxxxxxxx"
        maxlength="10"
        inputmode="numeric"
        autocomplete="tel">


    <div
        id="phone-error"
        class="customer-error"
        style="display:none;">

    </div>


    <button
        type="button"
        id="customer-search-btn"
        class="customer-search-btn">

        🔍 查詢我的紀錄

    </button>


    <a
        href="order.html"
        class="customer-order-btn">

        🍜 直接開始點餐

    </a>


</section>



<section
    id="customer-result"
    class="customer-result"
    style="display:none;">


    <div class="result-welcome">

        👋

        <div>

            <strong id="result-name">
                歡迎回來
            </strong>

            <p id="result-message">
                很高興再次見到您
            </p>

        </div>

    </div>



    <div class="customer-stat-grid">


        <div class="customer-stat-card">

            <span>
                🍜
            </span>

            <strong id="order-count">
                0
            </strong>

            <small>
                累計訂單
            </small>

        </div>



        <div class="customer-stat-card">

            <span>
                🕒
            </span>

            <strong id="last-order-time">
                -
            </strong>

            <small>
                最近訂單
            </small>

        </div>


    </div>



    <div class="customer-info-box">

        <h3>
            📋 最近一次訂單
        </h3>


        <div id="last-order-content">
            -
        </div>

    </div>



    <div class="customer-info-box">

        <h3>
            ⭐ 常點餐點
        </h3>


        <div id="favorite-items">
            -
        </div>

    </div>



    <a
        href="order.html"
        class="customer-start-order">

        🍜 立即開始點餐

    </a>


</section>



<section
    id="customer-not-found"
    class="customer-not-found"
    style="display:none;">


    <div class="not-found-icon">
        🔍
    </div>


    <h2>
        尚未找到您的訂單紀錄
    </h2>


    <p>

        這可能是您第一次使用線上點餐。

        <br>

        歡迎開始您的第一筆訂單！

    </p>


    <a
        href="order.html"
        class="customer-start-order">

        🍜 開始第一次點餐

    </a>


</section>


</main>



<script src="js/customer.js"></script>


</body>

</html>
